
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b12">
  <title>My Channel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b12;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      background: #12121c;
      border-bottom: 1px solid #29293a;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 1px;
    }

    header p {
      color: #a5a5bd;
      margin: 10px 0 0;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .feed-container {
      padding: 20px;
      min-height: 300px;
      background: #14141e;
      border: 1px solid #29293a;
      border-radius: 16px;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: #77778e;
      font-size: 13px;
    }

    a {
      color: #9d8cff;
    }
  </style>
</head>

<body>
  <header>
    <h1>My Channel</h1>
    <p>Check out the latest posts and updates.</p>
  </header>

  <main>
    <div class="feed-container">
      <!-- Curator.io feed -->
      <div id="curator-feed-default-feed-layout">
        <a
          href="https://curator.io"
          target="_blank"
          rel="noopener noreferrer"
          class="crt-logo crt-tag"
        >Powered by Curator.io</a>
      </div>
    </div>
  </main>

  <footer>
    Powered by Curator.io
  </footer>

  <script>
    /* curator-feed-default-feed-layout */
    (function () {
      var i, e, d = document, s = "script";

      i = d.createElement(s);
      i.async = 1;
      i.charset = "UTF-8";
      i.src =
        "https://cdn.curator.io/published/e86d98d2-b905-4512-ac07-1c27b956e933.js";

      e = d.getElementsByTagName(s)[0];
      e.parentNode.insertBefore(i, e);
    })();
  </script>
</body>
</html>
